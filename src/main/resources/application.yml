server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/simple_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    openai:
      # 从环境变量读取，禁止硬编码。本地开发在 IDEA 运行配置里设置 DEEPSEEK_API_KEY
      api-key: ${DEEPSEEK_API_KEY}
      base-url: "https://api.deepseek.com"
      chat:
        options:
          model: deepseek-chat
      embedding:
          enabled: false
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        tenant-name: SpringAiTenant
        database-name: SpringAiDatabase
        collection-name: simple-ai-docs
        initialize-schema: true
app:
  embedding:
    # 注意：不要带 /v1。Spring AI 内部会拼上 /v1/embeddings，带了就变成 /v1/v1/embeddings
    base-url: "https://dashscope.aliyuncs.com/compatible-mode"
    api-key: ${DASHSCOPE_API_KEY}
    model: text-embedding-v3
  rag:
    top-k: 4
    # collection 已改为 cosine 度量，score 即余弦相似度
    # 0.6 约等于"明确相关"的下限，实测后按需调整
    similarity-threshold: 0.6


mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.simpleai.demo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    org.springframework.web.client: DEBUG
