<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 40px 20px;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f6f7f9; color: #1f2328;
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
        .bar { display: flex; gap: 10px; margin-bottom: 20px; }
        #q {
            flex: 1; padding: 12px 14px; font-size: 14px;
            border: 1px solid #d0d7de; border-radius: 8px; outline: none;
            background: #fff;
        }
        #q:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
        #send {
            padding: 12px 22px; font-size: 14px; color: #fff;
            background: #1f6feb; border: none; border-radius: 8px; cursor: pointer;
        }
        #send:disabled { background: #94a3b8; cursor: not-allowed; }
        #out {
            background: #fff; border: 1px solid #e3e7ec; border-radius: 10px;
            padding: 22px 26px; min-height: 120px; line-height: 1.75; font-size: 14.5px;
        }
        #out:empty::before { content: "回答会显示在这里"; color: #9aa4b2; }
        #out pre { background: #f6f8fa; padding: 14px; border-radius: 8px; overflow-x: auto; }
        #out code { background: #f0f2f5; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
        #out pre code { background: none; padding: 0; }
        #out h2 { font-size: 17px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #eef1f4; }
        #out h3 { font-size: 15px; margin: 18px 0 8px; }
        #out table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        #out th, #out td { border: 1px solid #e3e7ec; padding: 8px 12px; text-align: left; }
        #out th { background: #f6f8fa; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Simple AI · 知识问答</h1>
    <div class="bar">
        <input id="q" placeholder="例如：解释一下 SpringBoot 自动配置" />
        <button id="send">提问</button>
    </div>
    <div id="out"></div>
</div>

<script>
    const q = document.getElementById('q');
    const send = document.getElementById('send');
    const out = document.getElementById('out');

    async function ask() {
        const question = q.value.trim();
        if (!question) return;

        send.disabled = true;
        send.textContent = '思考中…';
        out.innerHTML = '';

        try {
            const res = await fetch('/chat/ask?question=' + encodeURIComponent(question));
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const md = await res.text();
            out.innerHTML = marked.parse(md);
        } catch (e) {
            out.innerHTML = '<p style="color:#cf222e">请求失败：' + e.message + '</p>';
        } finally {
            send.disabled = false;
            send.textContent = '提问';
        }
    }

    send.addEventListener('click', ask);
    q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
